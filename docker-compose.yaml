version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - supabase-net   # ← to reach Supabase Postgres
      - app-net        # ← to reach Redis (and optionally frontend)
    env_file:
      - .env
    expose:
      - "8080"

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - app-net        # ← only API needs to reach Redis
    expose:
      - "6379"

  # Optional: frontend (if you need UI)
  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - app-net        # ← talks to API over internal network
    environment:
      - API_URL=http://evolution_api:8080  # if needed

volumes:
  evolution_instances:
  evolution_redis:

networks:
  supabase-net:
    external: true
    name: jgc0so8kscs0c0k0scccks8o  # ← your real Supabase network
  app-net:
    driver: bridge
