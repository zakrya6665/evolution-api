version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - ./app.env:/evolution/.env:ro
    networks:
      - supabase
      - app
    environment:
      # PostgreSQL Connection
      DB_POSTGRESDB_HOST: supabase-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: tpsZbH0tBifK0amZbVMLVYX47EPkiEnj
      DB_TYPE: postgresdb
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tpsZbH0tBifK0amZbVMLVYX47EPkiEnj

      # Critical: Prisma needs DATABASE_URL
      DATABASE_URL: "postgresql://postgres:tpsZbH0tBifK0amZbVMLVYX47EPkiEnj@supabase-db:5432/postgres?schema=whatsapp"

      # Schema search path for runtime
      POSTGRES_EXTRA_OPTIONS: "-c search_path=whatsapp,public"

      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution_redis:6379/6"

      # Other required Evolution API settings
      AUTHENTICATION_API_KEY: "your_actual_api_key_here"  # ← replace!
      SERVER_URL: "https://whatsapp-api.hexabizsolutions.cloud"
      LANGUAGE: "en"
      CONFIG_SESSION_PHONE_CLIENT: "Evolution API V2"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution_v2"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      QRCODE_LIMIT: "30"
      CHATWOOT_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "false"

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      app:
       aliases:
        - evolution_redis
    expose:
      - "6379"

volumes:
  evolution_instances:
  evolution_redis:

networks:
  supabase:
    external: true
    name: supabase-net
  app:
    driver: bridge
