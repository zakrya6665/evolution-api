version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - supabase-net
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - supabase-net  # ← also put frontend on same net if needed

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      supabase-net:
        aliases:
          - supabase-redis
    expose:
      - "6379"

volumes:
  evolution_instances:
  evolution_redis:

networks:
  supabase-net:
    external: true
    name: jgc0so8kscs0c0k0scccks8o  # ← critical!
